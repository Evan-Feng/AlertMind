name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend · lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        # TD-001 / TD-002 已在 9a481e6 偿还，mypy 成为真正的 CI 守门员。
        # 阶段 4+ 新增代码的类型错误将在第一次 push 时被拦截，禁止再加 `|| true` 绕过。
        run: uv run mypy --install-types --non-interactive alertmind

      - name: Pytest
        run: uv run pytest --cov=alertmind --cov-report=term-missing -v
