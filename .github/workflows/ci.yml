name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend · lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        # 阶段 1 允许 mypy 警告不阻塞（strict 模式下很多第三方库未完全类型化）。
        # 阶段 2 起视代码质量决定是否去掉 `|| true`，不要让它变成永久放水。
        run: |
          uv run mypy --install-types --non-interactive alertmind || true

      - name: Pytest
        # 阶段 1 尚无测试用例；pytest 会 exit 5（"no tests ran"），显式接受该退出码。
        # 其它非零退出码照常失败。
        run: |
          set +e
          uv run pytest tests --maxfail=1 -q
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No tests collected (Phase 1 scaffold)"
            exit 0
          fi
          exit "$rc"
