name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend · lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        # 阶段 1 允许 mypy 警告不阻塞（strict 模式下很多第三方库未完全类型化）。
        # 阶段 2 起视代码质量决定是否去掉 `|| true`，不要让它变成永久放水。
        run: |
          uv run mypy --install-types --non-interactive alertmind || true

      - name: Pytest
        run: uv run pytest --cov=alertmind --cov-report=term-missing -v
